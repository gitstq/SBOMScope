[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbomscope"
version = "1.0.0"
description = "Zero-dependency, offline-first SBOM parsing and compliance audit engine (SPDX & CycloneDX)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = ["sbom", "spdx", "cyclonedx", "supply-chain", "audit", "compliance", "offline", "zero-dependency"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.urls]
Homepage = "https://github.com/gitstq/SBOMScope"
Repository = "https://github.com/gitstq/SBOMScope"
Issues = "https://github.com/gitstq/SBOMScope/issues"

[project.scripts]
sbomscope = "sbomscope.cli:main"

[tool.setuptools]
packages = ["sbomscope", "sbomscope.parsers", "sbomscope.rules", "sbomscope.reporting"]
